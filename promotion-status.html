<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Usage Promotion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --surface: #111113;
    --border: #1e1e22;
    --border-bright: #2a2a30;
    --text: #e4e4e7;
    --muted: #52525b;
    --dim: #3f3f46;
    --cyan: #06b6d4;
    --cyan-dim: #0891b2;
    --cyan-glow: rgba(6,182,212,0.12);
    --green: #22c55e;
    --green-glow: rgba(34,197,94,0.1);
    --amber: #f59e0b;
    --amber-glow: rgba(245,158,11,0.1);
    --red: #ef4444;
    --red-glow: rgba(239,68,68,0.1);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .shell {
    width: 420px;
    padding: 0 16px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }

  .header-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .header-label span {
    color: var(--cyan);
  }

  /* Main card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border-bright), transparent);
  }

  /* Status section */
  .status-block {
    padding: 28px 28px 24px;
    border-bottom: 1px solid var(--border);
    transition: background 0.4s ease;
  }

  .status-block.active {
    background: radial-gradient(ellipse at 50% -20%, var(--green-glow) 0%, transparent 70%);
  }

  .status-block.peak {
    background: radial-gradient(ellipse at 50% -20%, var(--amber-glow) 0%, transparent 70%);
  }

  .status-block.expired {
    background: radial-gradient(ellipse at 50% -20%, var(--red-glow) 0%, transparent 70%);
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .status-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid;
  }

  .badge-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
  }

  .badge.on {
    color: var(--green);
    border-color: rgba(34,197,94,0.25);
    background: rgba(34,197,94,0.06);
  }
  .badge.on .badge-dot { background: var(--green); box-shadow: 0 0 5px var(--green); animation: pulse 2s infinite; }

  .badge.peak {
    color: var(--amber);
    border-color: rgba(245,158,11,0.25);
    background: rgba(245,158,11,0.06);
  }
  .badge.peak .badge-dot { background: var(--amber); }

  .badge.off {
    color: var(--muted);
    border-color: var(--border-bright);
    background: transparent;
  }
  .badge.off .badge-dot { background: var(--dim); }

  .status-headline {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.1;
    margin: 14px 0 6px;
    letter-spacing: -0.02em;
  }

  .status-headline.active { color: var(--green); }
  .status-headline.peak   { color: var(--amber); }
  .status-headline.expired{ color: var(--muted); }

  .status-sub {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.5;
  }

  /* Details grid */
  .details {
    padding: 20px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-bottom: 1px solid var(--border);
  }

  .detail-cell {
    padding: 12px 0;
  }

  .detail-cell:nth-child(odd) {
    padding-right: 20px;
    border-right: 1px solid var(--border);
  }

  .detail-cell:nth-child(even) {
    padding-left: 20px;
  }

  .detail-cell:nth-child(1),
  .detail-cell:nth-child(2) {
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }

  .detail-cell:nth-child(3),
  .detail-cell:nth-child(4) {
    padding-top: 16px;
  }

  .detail-key {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 5px;
  }

  .detail-val {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .detail-val.cyan { color: var(--cyan); }
  .detail-val.muted { color: var(--muted); }

  /* Time bar */
  .timebar-block {
    padding: 18px 28px 20px;
    border-bottom: 1px solid var(--border);
  }

  .timebar-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .timebar-wrap {
    position: relative;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  /* Peak zone: 8AM–2PM = 33.3%–58.3% of day */
  .peak-zone {
    position: absolute;
    top: 0;
    left: 33.33%;
    width: 25%;
    height: 100%;
    background: rgba(245,158,11,0.2);
  }

  .time-cursor {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 10px;
    background: var(--cyan);
    border-radius: 1px;
    box-shadow: 0 0 6px var(--cyan);
    transform: translateX(-50%);
    transition: left 1s linear;
  }

  /* Promo date bar */
  .datebar-block {
    padding: 18px 28px;
  }

  .datebar-label {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    color: var(--dim);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .datebar-wrap {
    position: relative;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .datebar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--cyan-dim), var(--cyan));
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  /* Footer */
  .footer {
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .clock {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .clock span {
    color: var(--dim);
    font-size: 10px;
  }

  .refresh-btn {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--dim);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: color 0.15s, border-color 0.15s;
  }

  .refresh-btn:hover {
    color: var(--cyan);
    border-color: var(--cyan-dim);
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <div class="logo-dot"></div>
    <div class="header-label">Claude / <span>Usage Promotion</span> / Mar 2026</div>
  </div>

  <div class="card">
    <!-- Status -->
    <div class="status-block" id="statusBlock">
      <div class="status-row">
        <div class="status-label">Promotion status</div>
        <div class="badge" id="badge"><div class="badge-dot"></div><span id="badgeText">—</span></div>
      </div>
      <div class="status-headline" id="headline">—</div>
      <div class="status-sub" id="subtext">Checking current time…</div>
    </div>

    <!-- Details -->
    <div class="details">
      <div class="detail-cell">
        <div class="detail-key">Current ET</div>
        <div class="detail-val cyan" id="detailTime">—</div>
      </div>
      <div class="detail-cell">
        <div class="detail-key">Day</div>
        <div class="detail-val" id="detailDay">—</div>
      </div>
      <div class="detail-cell">
        <div class="detail-key">Peak window</div>
        <div class="detail-val muted">8:00 – 14:00 ET</div>
      </div>
      <div class="detail-cell">
        <div class="detail-key">Weekdays only</div>
        <div class="detail-val muted">Mon – Fri</div>
      </div>
    </div>

    <!-- Time-of-day bar -->
    <div class="timebar-block">
      <div class="timebar-label">
        <span>0:00</span>
        <span>↑ peak 8–14 ET</span>
        <span>24:00</span>
      </div>
      <div class="timebar-wrap">
        <div class="peak-zone"></div>
        <div class="time-cursor" id="timeCursor"></div>
      </div>
    </div>

    <!-- Promo date progress -->
    <div class="datebar-block">
      <div class="datebar-label">
        <span>Mar 13</span>
        <span id="daysRemain">—</span>
        <span>Mar 27</span>
      </div>
      <div class="datebar-wrap">
        <div class="datebar-fill" id="dateFill"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="clock">Updated <span id="lastUpdate">—</span></div>
    <button class="refresh-btn" onclick="update()">↺ refresh</button>
  </div>
</div>

<script>
  const PROMO_START = new Date('2026-03-13T00:00:00-05:00');
  const PROMO_END   = new Date('2026-03-27T23:59:59-08:00'); // 11:59 PM PT

  const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function getETDate() {
    // Use Intl to get current time in America/New_York
    const now = new Date();
    const etParts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York',
      hour: 'numeric', minute: 'numeric', second: 'numeric',
      hour12: false,
      weekday: 'long',
      year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(now);

    const get = t => etParts.find(p => p.type === t)?.value;
    return {
      hour: parseInt(get('hour')),
      minute: parseInt(get('minute')),
      second: parseInt(get('second')),
      weekday: get('weekday'),     // "Monday" etc
      year: parseInt(get('year')),
      month: parseInt(get('month')),
      day: parseInt(get('day')),
      raw: now
    };
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function update() {
    const et = getETDate();
    const now = new Date();

    const isWeekday = !['Saturday','Sunday'].includes(et.weekday);
    const isPeakHour = et.hour >= 8 && et.hour < 14;
    const isPeakTime = isWeekday && isPeakHour;

    const isInPromo = now >= PROMO_START && now <= PROMO_END;

    // Status determination
    let state, headlineText, subText, badgeClass, badgeLabel;

    if (!isInPromo) {
      state = 'expired';
      headlineText = 'No Promotion';
      subText = now < PROMO_START
        ? 'Promotion has not started yet.'
        : 'Promotion ended March 27, 2026. Usage limits have returned to standard levels.';
      badgeClass = 'off';
      badgeLabel = 'INACTIVE';
    } else if (isPeakTime) {
      state = 'peak';
      headlineText = '1× — Peak Hours';
      subText = `It's a weekday during peak hours (8 AM–2 PM ET). Standard usage limits apply right now.`;
      badgeClass = 'peak';
      badgeLabel = 'PEAK';
    } else {
      state = 'active';
      headlineText = '2× Usage Active';
      subText = isWeekday
        ? `Off-peak weekday hours — your usage limit is doubled right now.`
        : `It's ${et.weekday} — weekends are fully off-peak. Usage limit is doubled.`;
      badgeClass = 'on';
      badgeLabel = '2× ON';
    }

    // Apply DOM
    const statusBlock = document.getElementById('statusBlock');
    statusBlock.className = 'status-block ' + (state === 'active' ? 'active' : state === 'peak' ? 'peak' : 'expired');

    const headline = document.getElementById('headline');
    headline.textContent = headlineText;
    headline.className = 'status-headline ' + (state === 'active' ? 'active' : state === 'peak' ? 'peak' : 'expired');

    document.getElementById('subtext').textContent = subText;

    const badge = document.getElementById('badge');
    badge.className = 'badge ' + badgeClass;
    document.getElementById('badgeText').textContent = badgeLabel;

    // Detail: time
    document.getElementById('detailTime').textContent =
      `${pad(et.hour)}:${pad(et.minute)}:${pad(et.second)}`;
    document.getElementById('detailDay').textContent = et.weekday;

    // Time cursor position (fraction of day)
    const fracOfDay = (et.hour * 3600 + et.minute * 60 + et.second) / 86400;
    document.getElementById('timeCursor').style.left = (fracOfDay * 100) + '%';

    // Promo date bar
    const totalDuration = PROMO_END - PROMO_START;
    const elapsed = Math.min(Math.max(now - PROMO_START, 0), totalDuration);
    const pct = isInPromo ? (elapsed / totalDuration) * 100 : now > PROMO_END ? 100 : 0;
    document.getElementById('dateFill').style.width = pct.toFixed(1) + '%';

    const daysLeft = Math.max(0, Math.ceil((PROMO_END - now) / 86400000));
    document.getElementById('daysRemain').textContent = isInPromo
      ? (daysLeft === 1 ? '1 day left' : daysLeft === 0 ? 'ends today' : `${daysLeft} days left`)
      : now > PROMO_END ? 'ended' : 'not started';

    // Last update
    const localTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('lastUpdate').textContent = localTime;
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
