<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0b"/>
      <stop offset="100%" stop-color="#111113"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <!-- Subtle accent glow top-left -->
  <circle cx="200" cy="200" r="400" fill="url(#accentGlow)"/>

  <!-- Grid dots pattern (subtle) -->
  <g opacity="0.06">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#ffffff"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Logo icon (2x2 grid) -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="14" height="14" rx="3" stroke="#6366f1" stroke-width="2.5" fill="none"/>
    <rect x="18" y="0" width="14" height="14" rx="3" stroke="#6366f1" stroke-width="2.5" fill="none"/>
    <rect x="0" y="18" width="14" height="14" rx="3" stroke="#6366f1" stroke-width="2.5" fill="none"/>
    <rect x="18" y="18" width="14" height="14" rx="3" stroke="#6366f1" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Logo text -->
  <text x="122" y="88" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e4e4e7" letter-spacing="-0.5">surplan</text>

  <!-- Tagline -->
  <text x="80" y="150" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#e4e4e7" letter-spacing="-1">
    <tspan x="80" dy="0">Plan your next project</tspan>
    <tspan x="80" dy="54" fill="#6366f1">start to deploy</tspan>
  </text>

  <!-- Subtitle -->
  <text x="80" y="280" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" fill="#71717a" letter-spacing="0">
    Free, local-only developer planning tool — schema designer, API planner, feature tracker
  </text>

  <!-- Entity card mockup -->
  <g transform="translate(680, 120)">
    <!-- Card background -->
    <rect width="440" height="380" rx="12" fill="#111113" stroke="#27272a" stroke-width="1"/>

    <!-- Card header -->
    <rect width="440" height="48" rx="12" fill="#18181b"/>
    <rect y="36" width="440" height="12" fill="#18181b"/>
    <line x1="0" y1="48" x2="440" y2="48" stroke="#27272a" stroke-width="1"/>

    <!-- Header content -->
    <circle cx="20" cy="24" r="5" fill="#6366f1"/>
    <text x="34" y="29" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#e4e4e7">User</text>
    <text x="68" y="29" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#71717a">6 columns</text>

    <!-- PK badge -->
    <rect x="350" y="14" width="28" height="18" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="356" y="27" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#f59e0b">PK</text>

    <!-- FK badge -->
    <rect x="384" y="14" width="36" height="18" rx="4" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-opacity="0.3" stroke-width="0.5"/>
    <text x="390" y="27" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#6366f1">2FK</text>

    <!-- Column header row -->
    <text x="20" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#52525b" letter-spacing="1" text-transform="uppercase">NAME</text>
    <text x="200" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#52525b" letter-spacing="1">TYPE</text>
    <text x="330" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#52525b" letter-spacing="1">NULL</text>
    <text x="390" y="72" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#52525b" letter-spacing="1">PK</text>
    <line x1="16" y1="80" x2="424" y2="80" stroke="#27272a" stroke-width="0.5"/>

    <!-- Row: id -->
    <text x="20" y="102" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7">id</text>
    <text x="200" y="102" font-family="JetBrains Mono, monospace" font-size="12" fill="#818cf8" opacity="0.8">uuid</text>
    <text x="342" y="102" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <text x="396" y="102" font-family="Inter, sans-serif" font-size="12" fill="#f59e0b">★</text>
    <line x1="16" y1="112" x2="424" y2="112" stroke="#27272a" stroke-width="0.5"/>

    <!-- Row: email -->
    <text x="20" y="134" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7">email</text>
    <text x="200" y="134" font-family="JetBrains Mono, monospace" font-size="12" fill="#818cf8" opacity="0.8">varchar</text>
    <text x="342" y="134" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <text x="396" y="134" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <line x1="16" y1="144" x2="424" y2="144" stroke="#27272a" stroke-width="0.5"/>

    <!-- Row: username -->
    <text x="20" y="166" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7">username</text>
    <text x="200" y="166" font-family="JetBrains Mono, monospace" font-size="12" fill="#818cf8" opacity="0.8">varchar</text>
    <text x="342" y="166" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <text x="396" y="166" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <line x1="16" y1="176" x2="424" y2="176" stroke="#27272a" stroke-width="0.5"/>

    <!-- Row: avatar_url -->
    <text x="20" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7">avatar_url</text>
    <text x="200" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#818cf8" opacity="0.8">text</text>
    <text x="340" y="198" font-family="Inter, sans-serif" font-size="12" fill="#71717a">○</text>
    <text x="396" y="198" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <line x1="16" y1="208" x2="424" y2="208" stroke="#27272a" stroke-width="0.5"/>

    <!-- Row: created_at -->
    <text x="20" y="230" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7">created_at</text>
    <text x="200" y="230" font-family="JetBrains Mono, monospace" font-size="12" fill="#818cf8" opacity="0.8">timestamp</text>
    <text x="342" y="230" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <text x="396" y="230" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>
    <line x1="16" y1="240" x2="424" y2="240" stroke="#27272a" stroke-width="0.5"/>

    <!-- Row: role_id (FK) -->
    <text x="20" y="262" font-family="JetBrains Mono, monospace" font-size="12" fill="#e4e4e7">role_id</text>
    <text x="200" y="262" font-family="JetBrains Mono, monospace" font-size="12" fill="#818cf8" opacity="0.8">uuid</text>
    <text x="340" y="262" font-family="Inter, sans-serif" font-size="12" fill="#71717a">○</text>
    <text x="396" y="262" font-family="Inter, sans-serif" font-size="12" fill="#52525b">—</text>

    <!-- Export format pills at bottom -->
    <g transform="translate(16, 300)">
      <rect x="0" y="0" width="56" height="22" rx="11" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="10" y="15" font-family="JetBrains Mono, monospace" font-size="9" fill="#6366f1">SQL</text>

      <rect x="64" y="0" width="68" height="22" rx="11" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="74" y="15" font-family="JetBrains Mono, monospace" font-size="9" fill="#06b6d4">Prisma</text>

      <rect x="140" y="0" width="52" height="22" rx="11" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="150" y="15" font-family="JetBrains Mono, monospace" font-size="9" fill="#10b981">Zod</text>

      <rect x="200" y="0" width="68" height="22" rx="11" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="210" y="15" font-family="JetBrains Mono, monospace" font-size="9" fill="#f59e0b">Drizzle</text>

      <rect x="276" y="0" width="76" height="22" rx="11" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="286" y="15" font-family="JetBrains Mono, monospace" font-size="9" fill="#ec4899">GraphQL</text>

      <rect x="0" y="30" width="76" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="10" y="45" font-family="JetBrains Mono, monospace" font-size="9" fill="#8b5cf6">OpenAPI</text>

      <rect x="84" y="30" width="76" height="22" rx="11" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="94" y="45" font-family="JetBrains Mono, monospace" font-size="9" fill="#06b6d4">TypeORM</text>

      <rect x="168" y="30" width="52" height="22" rx="11" fill="#64748b" fill-opacity="0.1" stroke="#64748b" stroke-opacity="0.3" stroke-width="0.5"/>
      <text x="178" y="45" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748b">18+</text>
    </g>
  </g>

  <!-- Bottom bar -->
  <rect y="590" width="1200" height="40" fill="#0a0a0b"/>
  <text x="80" y="616" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#52525b">surplan.xyz</text>
  <text x="1040" y="616" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#3f3f46">Free &amp; Open Source</text>
</svg>
