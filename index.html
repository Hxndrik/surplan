    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "surplan",
      "url": "https://surplan.xyz",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web",
      "offers": {

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('surplan-ui') || '{}');
          if (s && s.state && s.state.theme === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="5b0f4d05-9152-43c1-b302-d0ecc21e931f"></script>
